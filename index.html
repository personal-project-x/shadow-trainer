<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow">
<title>Shadow Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f13; --surface: #1a1a22; --surface2: #22222e;
    --border: rgba(255,255,255,0.08); --text: #f0f0f5; --muted: #888899;
    --accent: #7c6af7; --accent2: #a594ff;
    --green: #4ade80; --amber: #fbbf24; --red: #f87171;
    --radius: 16px; --font: 'Helvetica Neue', -apple-system, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: -webkit-fill-available; }
  header { padding: env(safe-area-inset-top, 44px) 20px 12px; display: flex; justify-content: space-between; align-items: center; }
  .app-title { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); }
  .set-badge { font-size: 12px; color: var(--muted); background: var(--surface); padding: 4px 10px; border-radius: 20px; }
  .progress-wrap { padding: 0 20px 16px; }
  .progress-track { height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: right; }
  main { flex: 1; padding: 0 20px; overflow-y: auto; }
  .seg { display: flex; gap: 4px; }
  .seg-btn { font-family: var(--font); font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; -webkit-appearance: none; }
  .seg-btn.active { background: var(--surface); color: var(--fg); border-color: var(--accent); }
  .week-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; margin-bottom: 10px; border: 1px solid var(--accent); border-radius: 10px; background: var(--surface); }
  .week-label { font-size: 13px; font-weight: 700; color: var(--fg); }
  .week-reset { font-family: var(--font); font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; -webkit-appearance: none; }
  .ej-timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ej-timer-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .ej-timer-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 2px; }
  .ej-timer-num { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 14px; text-align: right; }
  .axis-bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .axis-btn { font-family: var(--font); font-size: 11px; font-weight: 600; padding: 6px 6px; white-space: nowrap; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; flex: 1; transition: all 0.15s; -webkit-appearance: none; }
  .axis-btn.active { background: var(--surface); color: var(--fg); border-color: var(--accent); }
  .axis-btn:active { opacity: 0.8; }
  .mode-bar { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .mode-bar::-webkit-scrollbar { display: none; }
  .mode-btn { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; -webkit-appearance: none; }
  .mode-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
  .mode-btn:active { opacity: 0.8; }
  .phrase-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 14px; }
  .cat-tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); background: rgba(124,106,247,0.15); padding: 3px 8px; border-radius: 6px; margin-bottom: 12px; }
  .jp { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .en { font-size: 20px; font-weight: 500; line-height: 1.4; color: var(--text); }
  .status-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 12px; min-height: 52px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; background: var(--muted); }
  .dot.speaking { background: var(--accent); animation: blink 1s infinite; }
  .dot.recording { background: var(--red); animation: blink 0.6s infinite; }
  .dot.done { background: var(--green); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-msg { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .spoken { font-size: 11px; color: #ffffff; margin-top: 4px; font-style: italic; }
  .btn-grid { display: grid; gap: 8px; margin-bottom: 8px; }
  .g1 { grid-template-columns: 1fr; }
  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  button { font-family: var(--font); font-size: 13px; font-weight: 500; padding: 13px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 4px; -webkit-appearance: none; white-space: nowrap; }
  button:active { transform: scale(0.97); opacity: 0.85; }
  button:disabled { opacity: 0.3; }
  button.accent { background: var(--accent); color: #fff; border-color: transparent; }
  button.stop-btn { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); color: var(--red); }
  .feedback { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .score-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .score-num { font-size: 38px; font-weight: 600; }
  .score-sub { font-size: 13px; color: var(--muted); }
  .score-breakdown { font-size: 11px; color: var(--muted); margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score-breakdown span { background: var(--surface2); padding: 2px 8px; border-radius: 6px; }
  .fb-text { font-size: 13px; color: var(--muted); line-height: 1.8; white-space: pre-wrap; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; }
  .nav-btn { flex: 1; padding: 12px; font-size: 13px; }
  .nav-mid { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .complete-view { text-align: center; padding: 50px 20px; }
  .complete-view h2 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
  .complete-view p { font-size: 14px; color: var(--muted); margin-bottom: 28px; line-height: 1.7; white-space: pre-wrap; }
  .complete-view button { width: 100%; padding: 16px; font-size: 15px; }
  footer { height: env(safe-area-inset-bottom, 20px); }
  /* ── 瞬間英作文モード ── */
  .top-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .top-bar-btn { padding: 10px 4px; font-size: 12px; font-weight: 600; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; -webkit-appearance: none; transition: all 0.15s; line-height: 1.3; }
  .top-bar-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
  .ej-jp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px 20px; margin-bottom: 14px; text-align: center; min-height: 130px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .ej-jp-text { font-size: 20px; font-weight: 500; color: var(--text); line-height: 1.5; }
  .ej-ng-text { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 10px; opacity: 0.75; width: 100%; }
  .ej-en-reveal { font-size: 17px; color: var(--accent2); line-height: 1.5; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); width: 100%; }
  .ej-prog-label { font-size: 11px; color: var(--muted); text-align: right; margin-bottom: 4px; }
  .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .btn-x { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.35); color: var(--red); font-size: 22px; padding: 16px; border-radius: 12px; }
  .btn-d { background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.35); color: var(--amber); font-size: 22px; padding: 16px; border-radius: 12px; }
  .btn-o { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.35); color: var(--green); font-size: 22px; padding: 16px; border-radius: 12px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; }
  .toggle-label { font-size: 13px; color: var(--text); }
  .tog { width: 46px; height: 26px; border-radius: 13px; background: var(--surface2); position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
  .tog.on { background: var(--accent); }
  .tog-knob { width: 20px; height: 20px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.2s; }
  .tog.on .tog-knob { left: 23px; }
  .result-grid { display: flex; justify-content: space-around; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
  .result-item { text-align: center; }
  .result-big { font-size: 32px; font-weight: 600; line-height: 1; }
  .result-tiny { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 14px; max-height: 220px; overflow-y: auto; }
  .review-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .review-row:last-child { border-bottom: none; }
  .r-jp { font-size: 13px; color: var(--text); margin-bottom: 3px; }
  .r-en { font-size: 12px; color: var(--muted); }
  .ej-cat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div class="app-title">Shadow Trainer</div>
  <div class="set-badge" id="set-badge">Set 1</div>
</header>
<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progress" style="width:10%"></div></div>
  <div class="progress-label" id="prog-label">1 / 10</div>
</div>
<main>
  <div id="main-view">
    <div class="top-bar">
      <button class="top-bar-btn active" id="tmb-s" onclick="switchTop('shadow')">🎙 シャドウ</button>
      <button class="top-bar-btn" id="tmb-e" onclick="switchTop('ej')">⚡ 瞬間英作文</button>
      <button class="top-bar-btn" id="tmb-a" onclick="switchTop('audio')">🔊 音声版</button>
    </div>
    <div id="shadow-content">
    <div class="axis-bar-wrap" id="axis-bar"></div>
    <div class="mode-bar" id="mode-bar"></div>
    <div class="phrase-card">
      <div class="cat-tag" id="cat"></div>
      <div class="jp" id="jp"></div>
      <div class="en" id="en"></div>
    </div>
    <div class="status-box">
      <div class="dot" id="dot"></div>
      <div style="flex:1">
        <div class="status-msg" id="status-msg">「まず聴く」で英文を確認してください</div>
        <div class="spoken" id="spoken"></div>
      </div>
    </div>
    <div class="btn-grid g3" style="margin-bottom:8px">
      <button class="accent" id="btn-listen" onclick="doListen(1.0)">📢 等速で聴く</button>
      <button class="accent" id="btn-listen07" onclick="doListen(0.7)">👂 0.7倍で聴く</button>
      <button class="accent" id="btn-listen05" onclick="doListen(0.5)">🔍 0.5倍で聴く</button>
    </div>
    <div class="btn-grid g3" style="margin-bottom:8px">
      <button id="btn-play" onclick="doShadow(1.0)" disabled>▶ 等速</button>
      <button id="btn-07" onclick="doShadow(0.7)" disabled>🐇 0.7倍</button>
      <button id="btn-half" onclick="doShadow(0.5)" disabled>🐢 0.5倍</button>
    </div>
    <div class="btn-grid g1" style="margin-bottom:16px">
      <button class="stop-btn" id="btn-stop" onclick="doStop()" disabled>⏹ 停止・判定</button>
    </div>
    <div id="feedback-area"></div>
    <div class="nav-row">
      <button class="nav-btn" onclick="goNav(-1)">← 前へ</button>
      <div class="nav-mid" id="nav-mid">1 / 10</div>
      <button class="nav-btn" onclick="goNav(1)">次へ →</button>
    </div>
    </div><!-- /shadow-content -->
    <div id="ej-content" style="display:none">
      <!-- EJ Home -->
      <div id="ej-home">
        <div class="ej-cat-label">カテゴリを選択</div>
        <div class="axis-bar-wrap" id="ej-axis-bar"></div>
        <div class="mode-bar" id="ej-mode-bar"></div>
        <div class="week-row" id="ej-week-row" style="display:none">
          <span class="week-label" id="ej-week-label"></span>
          <button class="week-reset" onclick="ncResetWeek()">週をリセット</button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">🔀 シャッフル</span>
          <div class="tog on" id="ej-tog" onclick="ejToggleShuffle()"><div class="tog-knob"></div></div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">⏱ 自動表示</span>
          <div class="seg" id="ej-timer-seg">
            <button class="seg-btn active" data-s="3" onclick="ejSetTimer(3)">3秒</button>
            <button class="seg-btn" data-s="5" onclick="ejSetTimer(5)">5秒</button>
            <button class="seg-btn" data-s="0" onclick="ejSetTimer(0)">オフ</button>
          </div>
        </div>
        <div class="btn-grid g1" style="margin-bottom:16px">
          <button class="accent" id="ej-start-btn" onclick="ejStart()">▶ スタート（10問）</button>
        </div>
      </div>
      <!-- EJ Practice -->
      <div id="ej-practice" style="display:none">
        <div class="ej-prog-label" id="ej-prog-label">1 / 10</div>
        <div class="progress-track" style="margin-bottom:14px"><div class="progress-fill" id="ej-progress" style="width:10%"></div></div>
        <div class="ej-jp-card">
          <div class="ej-jp-text" id="ej-jp-text"></div>
          <div class="ej-en-reveal" id="ej-en-text" style="display:none"></div>
          <div class="ej-ng-text" id="ej-ng-text" style="display:none"></div>
        </div>
        <div id="ej-reveal-area">
          <div class="ej-timer-row" id="ej-timer-row" style="display:none">
            <div class="ej-timer-track"><div class="ej-timer-fill" id="ej-timer-fill"></div></div>
            <div class="ej-timer-num" id="ej-timer-num">3</div>
          </div>
          <div class="btn-grid g1" style="margin-bottom:10px">
            <button class="accent" onclick="ejReveal()">👁 英語を確認する</button>
          </div>
        </div>
        <div id="ej-score-area" style="display:none">
          <div class="btn-grid g3" style="margin-bottom:8px">
            <button onclick="ejListen(1.0)">📢 等速</button>
            <button onclick="ejListen(0.7)">👂 0.7倍</button>
            <button onclick="ejListen(0.5)">🔍 0.5倍</button>
          </div>
          <div class="score-grid">
            <button class="btn-x" onclick="ejScore('x')">✗</button>
            <button class="btn-d" onclick="ejScore('d')">△</button>
            <button class="btn-o" onclick="ejScore('o')">○</button>
          </div>
        </div>
      </div>
      <!-- EJ Results -->
      <div id="ej-results" style="display:none">
        <div class="result-grid">
          <div class="result-item"><div class="result-big" style="color:var(--green)" id="ej-o-count">0</div><div class="result-tiny">○ 正解</div></div>
          <div class="result-item"><div class="result-big" style="color:var(--amber)" id="ej-d-count">0</div><div class="result-tiny">△ もう少し</div></div>
          <div class="result-item"><div class="result-big" style="color:var(--red)" id="ej-x-count">0</div><div class="result-tiny">✗ 要復習</div></div>
        </div>
        <div id="ej-review-wrap"></div>
        <div class="btn-grid g1" style="margin-bottom:8px">
          <button class="accent" onclick="ejRestart()">🔄 もう一度</button>
        </div>
        <div class="btn-grid g1" style="margin-bottom:16px">
          <button onclick="ejGoHome()">← カテゴリ選択へ</button>
        </div>
      </div>
    </div><!-- /ej-content -->
    <div id="audio-content" style="display:none">
      <!-- Audio Home -->
      <div id="audio-home">
        <div class="ej-cat-label">カテゴリを選択</div>
        <div class="axis-bar-wrap" id="audio-axis-bar"></div>
        <div class="mode-bar" id="audio-mode-bar"></div>
        <div class="toggle-row">
          <span class="toggle-label">🔀 シャッフル</span>
          <div class="tog on" id="audio-tog" onclick="audioToggleShuffle()"><div class="tog-knob"></div></div>
        </div>
        <div class="btn-grid g1" style="margin-bottom:12px">
          <button class="accent" onclick="audioStart()">▶ スタート（自動再生・10問）</button>
        </div>
        <div style="font-size:12px;color:var(--muted);line-height:1.7;padding:0 4px 16px;">
          🧺 家事をしながらの「ながら学習」用。日本語音声 →「ポーン」の合図 → 10秒の間に声に出す → 英語の答えが自動で流れます。画面操作は不要です。
        </div>
      </div>
      <!-- Audio Practice -->
      <div id="audio-practice" style="display:none">
        <div class="ej-prog-label" id="audio-prog-label">1 / 10</div>
        <div class="progress-track" style="margin-bottom:14px"><div class="progress-fill" id="audio-progress" style="width:10%"></div></div>
        <div class="ej-jp-card">
          <div class="cat-tag" id="audio-cat" style="margin-bottom:10px"></div>
          <div class="ej-jp-text" id="audio-jp-text"></div>
          <div class="ej-en-reveal" id="audio-en-text" style="display:none"></div>
        </div>
        <div class="status-box" style="margin-bottom:14px">
          <div class="dot" id="audio-dot"></div>
          <div style="flex:1">
            <div class="status-msg" id="audio-status-msg">準備中...</div>
          </div>
        </div>
        <div class="btn-grid g3">
          <button id="audio-pause-btn" onclick="audioTogglePause()">⏸ 一時停止</button>
          <button class="stop-btn" style="grid-column: span 2" onclick="audioStop()">⏹ 停止してホームへ</button>
        </div>
      </div>
      <!-- Audio Results -->
      <div id="audio-results" style="display:none; text-align:center; padding: 40px 20px;">
        <h2 style="font-size:24px;font-weight:600;margin-bottom:8px;">🎉 10問完了！</h2>
        <p style="font-size:14px;color:var(--muted);margin-bottom:24px;">お疲れさまでした。</p>
        <div class="btn-grid g1" style="margin-bottom:8px">
          <button class="accent" onclick="audioStart()">🔄 もう一度（10問）</button>
        </div>
        <div class="btn-grid g1">
          <button onclick="audioGoHome()">← カテゴリ選択へ</button>
        </div>
      </div>
    </div><!-- /audio-content -->
  </div>
  <div id="complete-view" class="complete-view" style="display:none">
    <h2>🎉 セット完了！</h2>
    <p id="complete-msg"></p>
    <button class="accent" onclick="startNewSet()">次のセットへ →</button>
  </div>
</main>
<footer></footer>
<script>
const ALL_PHRASES = [
// ========== Sean TSV: Exercise 1 Part 1 社内で英語 ==========
{cat:"社内",jp:"（よそよそしくなく）おはようございます。",en:"G'morning! How're you doing?",g:""},
{cat:"社内",jp:"本当にありがとうございます。",en:"Thanks a lot. I appreciate it.",g:""},
{cat:"社内",jp:"それはちょっと分かりかねます。",en:"I'm not sure.",g:""},
{cat:"社内",jp:"（エレベーターで）どうぞお先に。",en:"After you. Go ahead.",g:"命令依頼|句動詞"},
{cat:"社内",jp:"すみません、ちょっと聞き取れなかったんですが。",en:"Sorry? Would you say that again?",g:"助動詞:依頼"},
{cat:"社内",jp:"まずい！会議中にお手洗いに行きたくなった…。",en:"Would you excuse me for a second? Excuse me, may I use the restroom?",g:"助動詞:依頼|YN疑問"},
{cat:"社内",jp:"名前が聞き取れない。スペルを教えてくれるとありがたいんだけど。",en:"I couldn't quite catch your name. Could you spell your name, please?",g:"助動詞:依頼"},
// ========== Sean TSV: Exercise 1 Part 2 外国人の来客 基本編 ==========

{cat:"文化",jp:"根回しとは文字通りには「木を動かす前に根を準備する」という意味です。",en:"Nemawashi literally means preparing the roots before moving a tree.",g:"動名詞"},

{cat:"文化",jp:"公の場で「ノー」と言わなくて済むので、関係が守られます。",en:"This protects relationships because no one has to say no in public.",g:"助動詞:義務|不定詞|接続詞"},
{cat:"文化",jp:"三方よし：すべての取引は売り手、買い手、社会に利益をもたらすべきです。",en:"Every deal should benefit the seller, the buyer, and society.",g:"助動詞:義務"},
{cat:"文化",jp:"欧米のCSRは社会的善をコストとして扱います。三方よしはそれを利益の基盤として扱います。",en:"Western CSR treats social good as a cost. Sanpo-yoshi treats it as the foundation of profit.",g:""},
{cat:"文化",jp:"欧米の考え方では、完璧とは欠点がないこと。わびさびは不完全さに美を見出します。",en:"In Western thinking, perfect means no flaws. Wabi-sabi sees beauty in imperfection.",g:""},

// 読み上げ・採点用に ~ / ... / 末尾記号を除去
function ttsText(s){
  return String(s||'')
    .replace(/\s*—\s*/g,', ')
    .replace(/\s*-ing\b/g,'')      // 「I've been -ing」→「I've been」
    .replace(/\s*~\s*/g,' ')       // 文中・文末の空欄記号を除去
    .replace(/\s*\.\.\.\s*(\?)?\s*$/,'$1')
    .replace(/\s+([,.!?])/g,'$1')  // 「Compared to , ...」→「Compared to,」
    .replace(/[,\s]+$/,'')
    .replace(/\s{2,}/g,' ')
    .trim();
}
function pickEnGBVoice(){
  if(!synth)return null;
  const vs=synth.getVoices();
  if(!vs||!vs.length)return null;
  const gb=vs.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().indexOf('en-gb')===0);
  const femaleFirst=['Google UK English Female','Kate','Serena','Sonia','Libby','Stephanie','Martha','Fiona','Karen','Moira'];
  const maleFallback=['Google UK English Male','Daniel','Arthur','Oliver','Graham'];
  const pref=voiceGender==='male'?maleFallback.concat(femaleFirst):femaleFirst.concat(maleFallback);
  for(const n of pref){const m=gb.find(v=>v.name&&v.name.indexOf(n)!==-1);if(m)return m;}
  return gb[0]||null;
}
function refreshEnGBVoice(){enGBVoice=pickEnGBVoice();}

  refreshEnGBVoice();
  if(typeof synth.addEventListener==='function'){synth.addEventListener('voiceschanged',refreshEnGBVoice);}
  else{synth.onvoiceschanged=refreshEnGBVoice;}

function dedupe(arr){
  const seen=new Set();
  return arr.filter(p=>{if(seen.has(p.en))return false;seen.add(p.en);return true;});
}
// NCデータ・チャンクは専用軸でのみ使う。場面別ランダム・文法別の各プールからは除外する。
function notNC(p){return p.cat!=='NC'&&p.cat!=='CHUNK';}
function getPool(catId){
  const fcat=FN_CATEGORIES.find(c=>c.id===catId);
  if(fcat){
    if(!fcat.sub) return ALL_PHRASES.filter(p=>p.cat==='CHUNK');
    return ALL_PHRASES.filter(p=>p.cat==='CHUNK'&&fcat.sub.includes(p.sub));
  }
  const ncat=NC_CATEGORIES.find(c=>c.id===catId);
  if(ncat){
    if(!ncat.sub) return ncWeeklySet();
    return dedupe(ALL_PHRASES.filter(p=>p.cat==='NC'&&ncat.sub.includes(p.sub)));
  }
  const gcat=GRAMMAR_CATEGORIES.find(c=>c.id===catId);
  if(gcat){
    if(!gcat.g) return dedupe(ALL_PHRASES.filter(p=>notNC(p)&&p.g&&p.g.length>0));
    return dedupe(ALL_PHRASES.filter(p=>notNC(p)&&p.g&&gcat.g.some(t=>p.g.split('|').includes(t))));
  }
  const cat=CATEGORIES.find(c=>c.id===catId);
  if(!cat||!cat.filter) return dedupe(ALL_PHRASES.filter(notNC));
  return dedupe(ALL_PHRASES.filter(p=>cat.filter.includes(p.cat)));
}

// 指示書 §4-②：1週間おなじセットを回す。毎日ランダムに全体から出さない。
function ncStartDate(){
  let s=null;
  try{s=localStorage.getItem('nc_start');}catch(e){}
  if(!s){
    s=new Date().toISOString().slice(0,10);
    try{localStorage.setItem('nc_start',s);}catch(e){}
  }
  return s;
}
function ncWeekNo(){
  const st=new Date(ncStartDate()+'T00:00:00');
  const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.floor((today-st)/86400000);
  return Math.max(1,Math.floor(days/7)+1);
}
// カテゴリが NC_WEEK_SIZE を超えるときは複数週に割る
function ncRotationPlan(){
  const plan=[];
  NC_ROTATION.forEach(sub=>{
    const n=ALL_PHRASES.filter(p=>p.cat==='NC'&&p.sub===sub).length;
    const parts=Math.max(1,Math.ceil(n/NC_WEEK_SIZE));
    for(let i=0;i<parts;i++)plan.push({sub:sub,part:i,parts:parts});
  });
  return plan;
}
function ncWeekLabel(){
  const plan=ncRotationPlan(),w=ncWeekNo();
  if(w>plan.length)return `第${w}週：${NC_ROTATION.length}カテゴリ混合`;
  const e=plan[w-1];
  return `第${w}週：${e.sub}`+(e.parts>1?` (${e.part+1}/${e.parts})`:'');
}
function ncResetWeek(){

  buildEjModeBar();

// 週番号を種にした決定的シャッフル（同じ週なら毎日おなじ並び）
function seededShuffle(arr,seed){
  const a=[...arr];let s=seed*9301+49297;
  for(let i=a.length-1;i>0;i--){
    s=(s*9301+49297)%233280;
    const j=Math.floor(s/233280*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function ncWeeklySet(){
  const plan=ncRotationPlan(),w=ncWeekNo();
  if(w<=plan.length){
    const e=plan[w-1];
    const pool=ALL_PHRASES.filter(p=>p.cat==='NC'&&p.sub===e.sub);
    return splitBlocks(pool,e.parts,1)[e.part]||[];
  }
  const pool=ALL_PHRASES.filter(p=>p.cat==='NC'&&NC_ROTATION.includes(p.sub));
  return pairSlice(pool,w,NC_MIX_SIZE);
}
// ペアを割らずに parts 個のブロック群へ等分する
function splitBlocks(pool,parts,seed){
  const blocks=seededShuffle(ncBlocks(pool),seed);
  const target=Math.ceil(pool.length/parts);
  const out=[];let cur=[];
  for(const b of blocks){
    if(cur.length>=target&&out.length<parts-1){out.push(cur);cur=[];}
    cur.push(...b);
  }
  out.push(cur);
  while(out.length<parts)out.push([]);
  return out;
}
// ペア（pg）を隣接させたままブロック単位でシャッフル（指示書 §5）
function ncBlocks(pool){
  const blocks=[],map={};
  pool.forEach(p=>{
    if(p.pg){ if(!map[p.pg]){map[p.pg]=[];blocks.push(map[p.pg]);} map[p.pg].push(p); }
    else blocks.push([p]);
  });
  return blocks;
}
function pairShuffle(pool,seed){
  const blocks=ncBlocks(pool);
  const sh=seed==null?shuffle([...blocks]):seededShuffle(blocks,seed);
  return [].concat(...sh);
}
// 上限までブロック単位で詰める。ペアを途中で割らない。
function pairSlice(pool,seed,limit){
  const blocks=ncBlocks(pool);
  const sh=seed==null?shuffle([...blocks]):seededShuffle(blocks,seed);
  const out=[];
  for(const b of sh){ if(out.length+b.length>limit)break; out.push(...b); }
  return out;
}

}

function calcScore(original,spoken){
  if(!spoken)return{total:0,coverage:0,order:0};
  const norm=t=>t.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean);
  const orig=norm(original),sp=norm(spoken);
  if(!orig.length)return{total:0,coverage:0,order:0};
  const pool=[...sp];let hits=0;
  for(const w of orig){const i=pool.indexOf(w);if(i!==-1){hits++;pool.splice(i,1);}}
  const coverage=Math.round(hits/orig.length*100);
  const lcs=calcLCS(orig,sp);
  const order=Math.round(lcs/orig.length*100);
  const total=Math.round(coverage*0.4+order*0.6);
  return{total,coverage,order};
}
function calcLCS(a,b){
  const m=a.length,n=b.length;
  const dp=Array(m+1).fill(null).map(()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}
async function evaluate(original,spoken){
  const{total,coverage,order}=calcScore(original,spoken);
  let feedback='';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:600,
        messages:[{role:'user',content:`ビジネス英語シャドウイングの採点をしてください。スピードは評価しません。

【元の文】${original}
【認識された発話】${spoken||'（認識なし）'}
【カバー率】${coverage}%
【語順スコア】${order}%

以下の形式で日本語でフィードバックしてください（合計180字以内）：
総評: （語順・発音・アクセントを総合して1文）
良い点: （具体的に）
改善点: （語順のミスや発音・アクセントの問題を具体的に指摘）
ヒント: （次回への実践的アドバイス1文）`}]
      })
    });
    const data=await res.json();
    feedback=data.content?.find(b=>b.type==='text')?.text||'フィードバック取得失敗';
  }catch(e){
    feedback=total>0?`カバー率${coverage}%、語順${order}%でした。`:'音声認識なしのため自己評価してください。';
  }
  scores.push(total);
  const color=total>=80?'var(--green)':total>=55?'var(--amber)':'var(--red)';
  const label=total>=90?'素晴らしい！':total>=75?'よくできました':total>=55?'もう少し！':total===0?'自己評価で':'もう一度挑戦';
  document.getElementById('feedback-area').innerHTML=`
    <div class="feedback">
      <div class="score-row">
        <div class="score-num" style="color:${color}">${total>0?total+'%':'—'}</div>
        <div class="score-sub">${label}</div>
      </div>
      ${total>0?`<div class="score-breakdown"><span>カバー率 ${coverage}%</span><span>語順 ${order}%</span></div>`:''}
      <div class="fb-text">${feedback}</div>
    </div>`;
  setStatus('done','採点完了');
  setDisabled(false,false,false,false,true);
}

  const o=ejScores.filter(s=>s==='o').length;
  const d=ejScores.filter(s=>s==='d').length;
  const x=ejScores.filter(s=>s==='x').length;
  document.getElementById('ej-o-count').textContent=o;
  document.getElementById('ej-d-count').textContent=d;
  document.getElementById('ej-x-count').textContent=x;
  const xItems=ejSet.filter((_,i)=>ejScores[i]==='x');
  const wrap=document.getElementById('ej-review-wrap');
  if(xItems.length>0){
    wrap.innerHTML=`<div class="review-card"><div style="font-size:12px;color:var(--red);margin-bottom:8px;font-weight:600;">✗ 要復習リスト（${xItems.length}件）</div>`+
      xItems.map(p=>`<div class="review-row"><div class="r-jp">${p.jp}</div><div class="r-en">${p.en}</div></div>`).join('')+`</div>`;
  }else{
    wrap.innerHTML=`<div style="text-align:center;padding:16px;font-size:14px;color:var(--green);">🌟 全問クリア！</div>`;
  }
  ejShowScreen('results');
}
function ejListen(rate){speak(ejSet[ejIdx].en,rate,null);}
function ejRestart(){ejStart();}

// ========== 音声版瞬間英作文（ながら学習）モード ==========
let audioCat='all';
let audioShuffleOn=true;
let audioSet=[],audioIdx=0;
let audioPaused=false;
let audioStopFlag=false;

function buildAudioModeBar(){
  document.getElementById('audio-mode-bar').innerHTML=catListFor(audioAxis).map(c=>
    `<button class="mode-btn${c.id===audioCat?' active':''}" onclick="selectAudioCat('${c.id}')">${c.label}</button>`
  ).join('');
  const ax=document.getElementById('audio-axis-bar');
  if(ax)ax.innerHTML=buildAxisBar(audioAxis,'setAudioAxis',['fn']);
}
function setAudioAxis(a){audioAxis=a;audioCat=catListFor(a)[0].id;buildAudioModeBar();}
function selectAudioCat(id){audioCat=id;buildAudioModeBar();}
function audioToggleShuffle(){
  audioShuffleOn=!audioShuffleOn;
  const tog=document.getElementById('audio-tog');
  audioShuffleOn?tog.classList.add('on'):tog.classList.remove('on');
}
function audioShowScreen(screen){
  ['audio-home','audio-practice','audio-results'].forEach(id=>{
    document.getElementById(id).style.display=(id==='audio-'+screen)?'block':'none';
  });
}
let sharedAudioCtx=null;
function getAudioCtx(){
  if(!sharedAudioCtx){
    try{sharedAudioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
  }
  if(sharedAudioCtx.state==='suspended'){
    try{sharedAudioCtx.resume();}catch(e){}
  }
  return sharedAudioCtx;
}
function playTone(freqList,spacing){
  const ctx=getAudioCtx();
  if(!ctx)return;
  const now=ctx.currentTime;
  freqList.forEach((freq,i)=>{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    gain.gain.value=0.0001;
    osc.connect(gain);gain.connect(ctx.destination);
    const start=now+i*spacing;
    gain.gain.exponentialRampToValueAtTime(0.28,start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+spacing*0.85);
    osc.start(start);osc.stop(start+spacing*0.9);
  });
}
function playPon(){playTone([880],0.4);}
function playChime(){playTone([660,880],0.15);}
function audioSetStatus(type,msg){
  const dot=document.getElementById('audio-dot');
  if(dot)dot.className='dot '+type;
  const m=document.getElementById('audio-status-msg');
  if(m)m.textContent=msg;
}
function waitForSpeech(text,lang,rate){
  return new Promise(resolve=>{
    if(audioStopFlag){resolve();return;}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;u.rate=rate;
    if(lang.indexOf('ja')===0){
      const voices=synth.getVoices();
      const jaV=voices.find(v=>v.lang&&v.lang.indexOf('ja')===0);
      if(jaV)u.voice=jaV;
    }else if(lang.indexOf('en')===0){
      u.lang='en-GB';
      const gv=enGBVoice||pickEnGBVoice();
      if(gv)u.voice=gv;
    }
    u.onend=()=>resolve();
    u.onerror=()=>resolve();
    synth.speak(u);
  });
}
function audioSleep(totalMs,onTick){
  return new Promise(resolve=>{
    let elapsed=0;const step=100;
    const timer=setInterval(()=>{
      if(audioStopFlag){clearInterval(timer);resolve();return;}
      if(!audioPaused){
        elapsed+=step;
        if(onTick)onTick(Math.max(0,totalMs-elapsed));
        if(elapsed>=totalMs){clearInterval(timer);resolve();}
      }
    },step);
  });
}
async function audioStart(){
  getAudioCtx();
  try{
    const primeU=new SpeechSynthesisUtterance('');
    primeU.volume=0;
    synth.speak(primeU);
  }catch(e){}
  const pool=getPool(audioCat);
  let arr=audioShuffleOn?shuffle([...pool]):[...pool];
  if(audioAxis==='fn'){
    audioSet=arr.slice(0,FN_MAX_SET);
  }else{
    let full=[];
    while(full.length<10)full=full.concat(arr);
    audioSet=full.slice(0,10);
  }
  audioIdx=0;
  audioStopFlag=false;
  audioPaused=false;
  updateAudioPauseBtn();
  audioShowScreen('practice');
  await audioRunLoop();
}
async function audioRunLoop(){
  for(audioIdx=0;audioIdx<audioSet.length;audioIdx++){
    if(audioStopFlag)return;
    const p=audioSet[audioIdx];
    document.getElementById('audio-cat').textContent=p.cat;
    document.getElementById('audio-jp-text').textContent=p.jp;
    document.getElementById('audio-en-text').style.display='none';
    document.getElementById('audio-prog-label').textContent=(audioIdx+1)+' / '+audioSet.length;
    document.getElementById('audio-progress').style.width=((audioIdx+1)/audioSet.length*100)+'%';

    audioSetStatus('idle','🔔 次の問題です...');
    playChime();
    await audioSleep(700);
    if(audioStopFlag)return;

    audioSetStatus('speaking','🗣 日本語再生中...');
    await waitForSpeech(p.jp,'ja-JP',1.0);
    if(audioStopFlag)return;

    await audioSleep(300);
    if(audioStopFlag)return;

    playPon();
    await audioSleep(10000,(remain)=>{
      const sec=Math.ceil(remain/1000);
      audioSetStatus('recording','🤔 考えて声に出してください...（残り'+sec+'秒）');
    });
    if(audioStopFlag)return;

    audioSetStatus('speaking','📣 答えです...');
    await waitForSpeech('答えです。','ja-JP',1.0);
    if(audioStopFlag)return;

    await audioSleep(200);
    if(audioStopFlag)return;

    document.getElementById('audio-en-text').textContent=p.en;
    document.getElementById('audio-en-text').style.display='block';
    audioSetStatus('speaking','🔊 英語再生中...');
    await waitForSpeech(ttsText(p.en),'en-GB',1.0);
    if(audioStopFlag)return;

    audioSetStatus('done','✓ 次のフレーズへ...');
    await audioSleep(1200);
    if(audioStopFlag)return;
  }
  if(!audioStopFlag)audioShowScreen('results');
}
function audioTogglePause(){
  audioPaused=!audioPaused;
  if(audioPaused){try{synth.pause();}catch(e){}}
  else{try{synth.resume();}catch(e){}}
  updateAudioPauseBtn();
}
function updateAudioPauseBtn(){
  const btn=document.getElementById('audio-pause-btn');
  if(btn)btn.textContent=audioPaused?'▶ 再開':'⏸ 一時停止';
}
function audioStop(){
  audioStopFlag=true;
  synth.cancel();
  audioShowScreen('home');
}
function audioGoHome(){audioShowScreen('home');}
// ========================================
buildModeBar();startNewSet();
